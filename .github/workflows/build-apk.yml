name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Farm Management APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
          gradle --version

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/mashallahagro/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/com/mashallahagro/app/MainActivity.kt
          fi

          if [ -f activity_main.xml ]; then
            mv activity_main.xml app/src/main/res/layout/activity_main.xml
          fi

          if [ -f colors.xml ]; then
            mv colors.xml app/src/main/res/values/colors.xml
          fi

          if [ -f strings.xml ]; then
            mv strings.xml app/src/main/res/values/strings.xml
          fi

          if [ -f themes.xml ]; then
            mv themes.xml app/src/main/res/values/themes.xml
          fi

          if [ -f proguard-rules.pro ]; then
            mv proguard-rules.pro app/proguard-rules.pro
          else
            touch app/proguard-rules.pro
          fi

          if [ -f app_logo.png ]; then
            mv app_logo.png app/src/main/res/drawable/app_logo.png
          fi

      - name: Create Gradle settings
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "farm-management-android"
          include(":app")
          EOF

      - name: Create root Gradle file
        shell: bash
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

      - name: Create Gradle properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create Android app Gradle file
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mashallahagro.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.mashallahagro.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

      - name: Update app URL
        shell: bash
        run: |
          if [ -f app/src/main/java/com/mashallahagro/app/MainActivity.kt ]; then
            sed -i 's#https://masaallahagro.com/app#https://masaallahagro.com#g' \
              app/src/main/java/com/mashallahagro/app/MainActivity.kt
          fi

      - name: Update app name
        shell: bash
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/Masaallah Agro/Farm Management/g' \
              app/src/main/AndroidManifest.xml || true
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Farm-Management-APK
          path: app/build/outputs/apk/debug/app-debug.apk
